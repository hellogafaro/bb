name: Build Computer Helper

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (no leading v)"
        required: true
        type: string
      publish:
        description: "Publish computer-helper-v<version> and upload the signed asset"
        required: true
        type: boolean
        default: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

permissions:
  contents: read

concurrency:
  group: build-computer-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS arm64 bb-computer-helper
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      has_signing_secrets: ${{ steps.signing.outputs.has_signing_secrets }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Verify signing secrets
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${MACOS_CERTIFICATE_P12:-}" && -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "has_signing_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS signing secrets are not configured; bb-computer-helper will ship ad-hoc signed. Users re-grant permissions once per re-sign."
            echo "has_signing_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.has_signing_secrets == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/computer-helper-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and package bb-computer-helper
        id: package
        env:
          BB_COMPUTER_HELPER_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ./apps/computer-macos/release.sh "$RUNNER_TEMP/release-asset"
          {
            echo "asset_dir=$RUNNER_TEMP/release-asset"
            echo "asset_name=bb-computer-helper-${{ inputs.version }}-darwin-arm64.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the packaged executable
        if: steps.signing.outputs.has_signing_secrets == 'true'
        env:
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          set -euo pipefail
          ASSET_DIR="${{ steps.package.outputs.asset_dir }}"
          codesign --force --options runtime --sign "$MACOS_CERTIFICATE_NAME" "$ASSET_DIR/bb-computer-helper"
          tar -czf "$ASSET_DIR/${{ steps.package.outputs.asset_name }}" -C "$ASSET_DIR" bb-computer-helper
          shasum -a 256 "$ASSET_DIR/${{ steps.package.outputs.asset_name }}" | tee "$ASSET_DIR/${{ steps.package.outputs.asset_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bb-computer-helper-darwin-arm64
          path: |
            ${{ steps.package.outputs.asset_dir }}/*.tar.gz
            ${{ steps.package.outputs.asset_dir }}/*.sha256
          if-no-files-found: error

  publish:
    name: Publish computer-helper release
    needs: build
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bb-computer-helper-darwin-arm64
          path: release

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="computer-helper-v$VERSION"
          gh release create "$TAG" \
            --title "bb Computer helper $VERSION" \
            --notes "Native macOS helper for the Computer feature (apps/computer-macos). See computer-helper-provisioning.ts for the pin this asset satisfies." \
            release/*.tar.gz
          SHA256="$(cat release/*.sha256 | awk '{print $1}')"
          echo "### bb-computer-helper $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update COMPUTER_HELPER_PINS in apps/host-daemon/src/computer/computer-helper-provisioning.ts:" >> "$GITHUB_STEP_SUMMARY"
          echo '```ts' >> "$GITHUB_STEP_SUMMARY"
          echo "\"darwin-arm64\": { version: \"$VERSION\", asset: \"bb-computer-helper-$VERSION-darwin-arm64.tar.gz\", sha256: \"$SHA256\" }," >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
